services:
  backend:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    container_name: koy-dernegi-backend
    restart: unless-stopped
    volumes:
      - koy_veri:/app/data
    environment:
      - PORT=8000
      - DATABASE_DOSYA=/app/data/koydernegi.db
      - UPLOAD_KLASOR=/app/data/uploads
    networks:
      - koy_net

  nginx:
    image: nginx:1.27-alpine
    container_name: koy-dernegi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    depends_on:
      - backend
    networks:
      - koy_net

  certbot:
    image: certbot/certbot:latest
    container_name: koy-dernegi-certbot
    profiles: ["cli"]
    ports:
      - "80:80"
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    networks:
      - koy_net

volumes:
  koy_veri:
  certbot-webroot:
  certbot-certs:

networks:
  koy_net: